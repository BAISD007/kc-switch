[package]
name = "kc-switch"
version = "0.1.0"
description = "Manager for Kimi Code providers, MCP, skills and plugins"
authors = ["KC-Switch"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
